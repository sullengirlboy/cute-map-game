<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Map Game</title>
    <script src="cutemapgame.js" defer></script>
    <link rel="stylesheet" href="cutemapgame.css">
</head>
<body>
    <header>
        <h1>title</h1>
    </header>
    <main>
    <div class="box-inner">
        <div id="startBtn-p">
            <button id="startBtn">start!</button>
        </div>
        <div id="game-p">
            <div class="top-bar">
                <div>
                    <p><span id="progress">0</span>/12
                    <span class="lightgray">♡</span>
                    <span id="score">0%</span></p>
                </div>
                <p>where is <b><span class="current-target"></span></b>?</p>
                <div>
                    <p><span id="timer"></span>
                    <span class="lightgray">♡</span>
                    <button id="quitBtn">quit</button></p>
                </div>
            </div>
            <div id="map">
                <div class="tooltip" id="cursor-tooltip">Click on <b><span class="current-target"></span></b></div>
            </div>
        </div>
    </div>
    </main>
    <footer>
        <p>hi</p>
    </footer>
</body>
</html>
