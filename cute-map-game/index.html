<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Map Game</title>
    <script src="cutemapgame.js" defer></script>
    <link rel="stylesheet" href="cutemapgame.css">
</head>
<body>
    <main>
    <header>
        <div>
            <img src="/cute-map-game/img/gamefavicon.gif">
            <h1>cute-map-game.html</h1>
        </div>
        <div>
            <img src="/cute-map-game/img/indexfavicon.gif">
            <a href="index.html">index.html</a>
        </div>
    </header>
    <div class="box-inner">
        <div id="startBtn-p">
            <p></p>
            <img src="/cute-map-game/img/pinkbow.gif">
            <button id="startBtn">start!</button>
        </div>
        <div id="game-p">
            <div class="top-bar">
                <div>
                    <p><span id="progress">0</span>/12
                    <span class="lightgray">♡</span>
                    <span id="score">0%</span></p>
                </div>
                <p id="top-bar-para">where is <b><span class="current-target"></span></b>? <span id="skipBtn">▶︎│</span></p>
                <div>
                    <p><span id="timer"></span>
                    <span class="lightgray">♡</span>
                    <button id="quitBtn">quit</button></p>
                </div>
            </div>
            <div id="map">
                <div class="tooltip" id="cursor-tooltip">Click on <b><span class="current-target"></span></b></div>
            </div>
        </div>
        <div id="end-p">
            <p>you got <span id="final-score"></span> in <span id="final-time"></span>!</p>
            <button id="restartBtn">restart</button>
            <button id="seeMapBtn">admire map</button>
        </div>
    </div>
    </main>
    <footer>
        <p>handcoded in 2026 <a href="https://copyheart.org/manifesto">♡ copying is an act of love. please copy.</a></p>
    </footer>
</body>
</html>
